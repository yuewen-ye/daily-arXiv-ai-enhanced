name: Daily papers · Zotero + DeepSeek
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.CV,cs.LG,cs.AI,cs.CL' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      SUMMARY_LIMIT: ${{ vars.SUMMARY_LIMIT || '50' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'jinaai/jina-embeddings-v5-text-nano-retrieval' }}
      ZOTERO_INCLUDE_PATHS: ${{ vars.ZOTERO_INCLUDE_PATHS || 'null' }}
      ZOTERO_IGNORE_PATHS: ${{ vars.ZOTERO_IGNORE_PATHS || 'null' }}
      UV_HTTP_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check credentials
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PYCONFIG'
          import os
          required = ('ZOTERO_ID', 'ZOTERO_KEY', 'DEEPSEEK_API_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Add repository Secrets before running: ' + ', '.join(missing))
          PYCONFIG
      - name: Restore archives and daily request ledger
        run: python scripts/state.py restore
      - name: Install CPU dependencies
        run: |
          pip install uv
          uv sync --locked --extra zotero
      - name: Cache public embedding model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embeddings-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ vars.EMBEDDING_MODEL || 'jina-v5-nano' }}
      - name: Crawl the configured arXiv categories
        id: crawl
        run: |
          today=$(date -u +%Y-%m-%d)
          mkdir -p data
          cd daily_arxiv
          ../.venv/bin/scrapy crawl arxiv -O "../data/$today.jsonl" -s LOG_LEVEL=WARNING
          echo "date=$today" >> "$GITHUB_OUTPUT"
      - name: Rank with Zotero and summarize up to the daily limit
        id: summarize
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CRAWL_DATE: ${{ steps.crawl.outputs.date }}
        run: .venv/bin/python -m ai.daily --data "data/$CRAWL_DATE.jsonl"
      - name: Save archives and charged attempts, including partial failures
        if: always() && steps.summarize.outcome != 'skipped' && steps.summarize.outcome != ''
        run: python scripts/state.py save
      - name: Build the public site
        run: python scripts/build_site.py --repository "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
